name: sapsan-watch

on:
  schedule:
    - cron: "*/10 * * * *"   # каждые 10 минут (GitHub может задержать на 5-15 мин)
  workflow_dispatch:          # кнопка «Run workflow» для ручного прогона
    inputs:
      debug:
        description: "Печатать сырой ответ РЖД в лог"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sapsan-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Проверить цены
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRIP_DATE: "20.09.2026"
          TIME_FROM: "09:20"
          TIME_TO: "09:50"
          PRICE_THRESHOLD: "14000"
          DROP_DELTA: "1000"
          PRICE_CEILING: "30000"
          WANTED_CLASSES: ""        # пусто = разведка, показываем все классы
          DEBUG: ${{ inputs.debug && '1' || '' }}
        run: python sapsan_watch.py

      - name: Сохранить состояние
        if: always()
        run: |
          git config user.name  "sapsan-watch"
          git config user.email "actions@github.com"
          git add state.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "state: $(date -u +%H:%M) [skip ci]"
          git pull --rebase --autostash || true
          git push || true
